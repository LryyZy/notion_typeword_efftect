<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 已有的 meta 标签 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 新增：这些让 Notion 能正确嵌入 -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' 'unsafe-inline'; 
                   frame-ancestors https://*.notion.so https://notion.so;
                   script-src 'self' 'unsafe-inline'">
    
    <meta name="referrer" content="no-referrer">
    <meta property="og:title" content="打字机效果">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lryyzy.github.io/notion_typeword_efftect/">
    <meta property="og:description" content="文字从左到右逐渐显示">
    
    <title>打字机动画</title>
    
    <style>
    /* 你的样式保持不变 */
    </style>
    <title>打字机动画效果</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion 打字机效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display:inline-block;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .typewriter-container {
            width: 100%;
            max-width: 600px;
            background: transparent;
        }
        
        .typewriter-text {
            color: #37352f; /* Notion 文字颜色 */
            font-size: 24px;
            line-height: 1.5;
            overflow: hidden;
            border-right: 3px solid #37352f; /* 光标 */
            white-space: nowrap; /* 允许多行 */
            word-wrap: break-word;
            width: 0;
            animation: 
                typing 2s steps(60, end) forwards;
                blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #37352f }
        }
        
        /* 响应式调整 */
        @media (max-width: 640px) {
            .typewriter-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="typewriter-container">
        <div class="typewriter-text" id="text">
            此為一段測試文字
        </div>
    </div>

    <script>
        // 从 URL 参数获取文字内容（可选）
        function getTextFromURL() {
            const params = new URLSearchParams(window.location.search);
            const text = params.get('text');
            if (text) {
                return decodeURIComponent(text);
            }
            return null;
        }
        
        // 从本地存储获取文字（可选）
        function getTextFromStorage() {
            return localStorage.getItem('notion-typewriter-text');
        }
        
        // 设置文字内容
        function setText(content) {
            const textElement = document.getElementById('text');
            if (content) {
                textElement.textContent = content;
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            let text = getTextFromURL() || getTextFromStorage() || document.getElementById('text').textContent;
            setText(text);
            
            // 动画结束后移除光标
            const textElement = document.getElementById('text');
            setTimeout(() => {
                textElement.style.borderRight = 'none';
            }, 4000); // 与动画时间一致
        });
    </script>
</body>
</html>
